<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="sq" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A74FF"/><stop offset="1" stop-color="#0A3DCC"/></linearGradient>
    <symbol id="G" viewBox="0 0 24 24"><path d="M17.09 6.91A7.2 7.2 0 1 0 19.2 12H12.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17.1" cy="6.9" r="2.1" fill="#8FCCFF"/></symbol>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".14"/></filter>
    <clipPath id="t1"><rect x="0" y="-20" width="330" height="50"><animate attributeName="width" values="330;330;0;330" keyTimes="0;0.6;0.62;0.85" dur="8s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t2"><rect x="0" y="-20" width="220" height="50"><animate attributeName="width" values="220;220;0;0;220" keyTimes="0;0.6;0.62;0.7;0.85" dur="8s" repeatCount="indefinite"/></rect></clipPath>
    <style>
      .ok{animation:ok 8s infinite}
      @keyframes ok{0%,60%{opacity:1}62%,72%{opacity:0}78%,100%{opacity:1}}
      .appear{transform-box:fill-box;transform-origin:center;animation:appear 8s infinite}
      @keyframes appear{0%,60%{opacity:1;transform:scale(1)}63%{opacity:0;transform:scale(.4)}74%{opacity:1;transform:scale(1.18)}78%,100%{opacity:1;transform:scale(1)}}
      .drop{animation:drop 8s infinite}
      @keyframes drop{0%,60%{opacity:1;transform:none}63%,78%{opacity:0;transform:translateY(-12px)}86%,100%{opacity:1;transform:none}}
    </style>
  </defs>
  <rect width="1200" height="400" rx="28" fill="#F5F6F8"/>
  <text x="600" y="54" font-size="15" font-weight="600" fill="#1F6BFF" letter-spacing="1.5" text-anchor="middle">INSTALL IN 3 STEPS</text>

  <!-- step 1 -->
  <g transform="translate(40 90)" filter="url(#sh)">
    <rect width="360" height="260" rx="20" fill="#fff"/>
    <circle cx="36" cy="38" r="16" fill="#1F6BFF"/><text x="36" y="44" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="64" y="44" font-size="18" font-weight="600" fill="#1d1d1f">Get the code</text>
    <rect x="20" y="78" width="320" height="120" rx="12" fill="#1c1c1e"/>
    <g font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="13">
      <g transform="translate(36 112)" clip-path="url(#t1)"><text fill="#e5e5ea">git clone github.com/GauthamWho/</text><text y="22" fill="#e5e5ea">G.ai-Token-Tray &amp;&amp; cd G.ai-Token-Tray</text></g>
      <text x="36" y="176" fill="#32d74b" class="ok">✓ Cloned</text>
    </g>
    <text x="20" y="232" font-size="14" fill="#6e6e73">Needs a Mac with Xcode installed.</text>
  </g>
  <!-- step 2 -->
  <g transform="translate(420 90)" filter="url(#sh)">
    <rect width="360" height="260" rx="20" fill="#fff"/>
    <circle cx="36" cy="38" r="16" fill="#1F6BFF"/><text x="36" y="44" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="64" y="44" font-size="18" font-weight="600" fill="#1d1d1f">Build and open</text>
    <rect x="20" y="78" width="320" height="120" rx="12" fill="#1c1c1e"/>
    <g font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="13">
      <g transform="translate(36 112)" clip-path="url(#t2)"><text fill="#e5e5ea">./build.sh --open</text></g>
      <text x="36" y="144" fill="#8e8e93" class="ok">Build complete!</text>
      <text x="36" y="176" fill="#32d74b" class="ok">✓ G.ai Token Tray.app</text>
    </g>
    <text x="20" y="232" font-size="14" fill="#6e6e73">One command. About 20 seconds.</text>
  </g>
  <!-- step 3 -->
  <g transform="translate(800 90)" filter="url(#sh)">
    <rect width="360" height="260" rx="20" fill="#fff"/>
    <circle cx="36" cy="38" r="16" fill="#1F6BFF"/><text x="36" y="44" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="64" y="44" font-size="18" font-weight="600" fill="#1d1d1f">Click the G, top right</text>
    <rect x="20" y="78" width="320" height="26" rx="6" fill="#ececf0"/>
    <text x="320" y="96" font-size="12" fill="#6e6e73" text-anchor="end">Wed 4 Nov 23:50</text>
    <g class="appear"><rect x="196" y="81" width="20" height="20" rx="5" fill="url(#sq)"/><use href="#G" x="198.4" y="83.4" width="15.2" height="15.2"/></g>
    <g class="drop">
      <rect x="110" y="112" width="210" height="96" rx="14" fill="#fff" stroke="#e5e5ea"/>
      <rect x="122" y="124" width="186" height="50" rx="10" fill="#E9F6EC"/>
      <text x="134" y="144" font-size="10" font-weight="600" fill="#8e8e93" letter-spacing="1">BEST RIGHT NOW</text>
      <text x="134" y="164" font-size="15" font-weight="500" fill="#1d1d1f">Work OpenRouter</text>
      <text x="134" y="194" font-size="12" fill="#6e6e73">+ Add key</text>
    </g>
    <path d="M206 98l0 16 4-4 3 7 3-1-3-7 6 0z" fill="#1d1d1f" stroke="#fff" stroke-width="1"/>
    <text x="20" y="232" font-size="14" fill="#6e6e73">Then press + Add key and paste.</text>
  </g>
</svg>
