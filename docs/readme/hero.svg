<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B3FD1"/><stop offset="1" stop-color="#1F6BFF"/></linearGradient>
    <linearGradient id="sq" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A74FF"/><stop offset="1" stop-color="#0A3DCC"/></linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.6"><stop offset="0" stop-color="#8FCCFF" stop-opacity=".45"/><stop offset="1" stop-color="#8FCCFF" stop-opacity="0"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#001a66" flood-opacity=".35"/></filter>
    <symbol id="G" viewBox="0 0 24 24"><path d="M17.09 6.91A7.2 7.2 0 1 0 19.2 12H12.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17.1" cy="6.9" r="2.1" fill="#8FCCFF"/></symbol>
    <style>
      .ring{stroke-dasharray:47;animation:draw 6s cubic-bezier(.65,0,.35,1) infinite}
      @keyframes draw{0%,70%{stroke-dashoffset:0}80%{stroke-dashoffset:47}100%{stroke-dashoffset:0}}
      .bar{animation:fill 4s cubic-bezier(.65,0,.35,1) infinite}
      @keyframes fill{0%,55%{width:268px}65%{width:4px}100%{width:268px}}
      .pulse{animation:pulse 2s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
      .float{animation:float 5s ease-in-out infinite}
      .f2{animation-delay:-1.7s}.f3{animation-delay:-3.1s}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    </style>
  </defs>
  <rect width="1200" height="440" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="28" fill="url(#glow)"/>

  <!-- logo -->
  <g>
    <rect x="68" y="90" width="120" height="120" rx="32" fill="url(#sq)" stroke="#ffffff" stroke-opacity=".28"/>
    <g transform="translate(77 99) scale(4.25)">
      <path class="ring" d="M17.09 6.91A7.2 7.2 0 1 0 19.2 12H12.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="17.1" cy="6.9" r="2.1" fill="#8FCCFF"/>
    </g>
  </g>

  <text x="68" y="282" font-size="54" font-weight="600" fill="#fff" letter-spacing="-1.2">G.ai Token Tray</text>
  <text x="70" y="326" font-size="24" fill="#DCE8FF">Which AI key should I use right now?</text>
  <g>
    <rect x="68" y="352" width="196" height="34" rx="17" fill="#ffffff" fill-opacity=".14" stroke="#fff" stroke-opacity=".25"/>
    <text x="88" y="374" font-size="15" fill="#fff">macOS menu bar app</text>
    <rect x="274" y="352" width="168" height="34" rx="17" fill="#ffffff" fill-opacity=".14" stroke="#fff" stroke-opacity=".25"/>
    <text x="294" y="374" font-size="15" fill="#fff">by GauthamWho</text>
  </g>

  <!-- floating provider tiles -->
  <g class="float"><rect x="560" y="70" width="46" height="46" rx="12" fill="#fff" fill-opacity=".16"/><text x="583" y="99" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">OR</text></g>
  <g class="float f2"><rect x="540" y="300" width="46" height="46" rx="12" fill="#fff" fill-opacity=".16"/><text x="563" y="329" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">G</text></g>
  <g class="float f3"><rect x="1110" y="330" width="46" height="46" rx="12" fill="#fff" fill-opacity=".16"/><text x="1133" y="359" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">GQ</text></g>
  <g class="float f2"><rect x="1120" y="60" width="46" height="46" rx="12" fill="#fff" fill-opacity=".16"/><text x="1143" y="89" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">DS</text></g>

  <!-- mini panel -->
  <g filter="url(#sh)">
    <rect x="660" y="50" width="420" height="340" rx="24" fill="#fff"/>
    <g transform="translate(684 72)"><rect width="22" height="22" rx="6" fill="url(#sq)"/><use href="#G" x="2.6" y="2.6" width="16.8" height="16.8"/></g>
    <text x="716" y="89" font-size="16" font-weight="500" fill="#1d1d1f">G.ai Token Tray</text>
    <text x="1056" y="89" font-size="13" fill="#a1a1a6" text-anchor="end">Updated 12s ago</text>
    <rect x="684" y="110" width="372" height="150" rx="18" fill="#E9F6EC"/>
    <text x="704" y="138" font-size="12" font-weight="600" fill="#8e8e93" letter-spacing="1">BEST RIGHT NOW</text>
    <circle cx="976" cy="134" r="4" fill="#28a745" class="pulse"/><text x="1036" y="138" font-size="13" fill="#6e6e73" text-anchor="end">Healthy</text>
    <text x="704" y="174" font-size="18" font-weight="500" fill="#1d1d1f">Work OpenRouter</text>
    <rect x="968" y="156" width="70" height="30" rx="15" fill="#5856d6"/><text x="1003" y="176" font-size="14" font-weight="500" fill="#fff" text-anchor="middle">Use</text>
    <text x="704" y="222" font-size="34" font-weight="300" fill="#1d1d1f" letter-spacing="-.6">$18.40</text>
    <text x="818" y="221" font-size="13" fill="#6e6e73">left of $25</text>
    <text x="1036" y="221" font-size="13" fill="#6e6e73" text-anchor="end">lasts ~6 days</text>
    <rect x="704" y="236" width="332" height="4" rx="2" fill="#000" fill-opacity=".06"/>
    <rect class="bar" x="704" y="236" width="268" height="4" rx="2" fill="#28a745"/>
    <text x="700" y="290" font-size="11" font-weight="600" fill="#a1a1a6" letter-spacing="1">COMING BACK</text>
    <rect x="700" y="302" width="30" height="30" rx="8" fill="#6467F2" fill-opacity=".14"/><text x="715" y="322" font-size="11" font-weight="600" fill="#6467F2" text-anchor="middle">OR</text>
    <text x="742" y="315" font-size="14" font-weight="500" fill="#1d1d1f">Script key</text>
    <text x="742" y="331" font-size="12" fill="#6e6e73">Daily spend cap resets</text>
    <text x="1056" y="318" font-size="15" font-weight="500" fill="#1d1d1f" text-anchor="end">1h 47m</text>
    <text x="1056" y="334" font-size="12" fill="#a1a1a6" text-anchor="end">01:36</text>
    <rect x="700" y="346" width="30" height="30" rx="8" fill="#F55036" fill-opacity=".14"/><text x="715" y="366" font-size="11" font-weight="600" fill="#F55036" text-anchor="middle">GQ</text>
    <text x="742" y="360" font-size="14" font-weight="500" fill="#1d1d1f">Groq free</text>
    <text x="742" y="376" font-size="12" fill="#6e6e73">Requests today reset</text>
    <text x="1056" y="363" font-size="15" font-weight="500" fill="#1d1d1f" text-anchor="end">7h 11m</text>
  </g>
</svg>
