<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="sq" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A74FF"/><stop offset="1" stop-color="#0A3DCC"/></linearGradient>
    <symbol id="G" viewBox="0 0 24 24"><path d="M17.09 6.91A7.2 7.2 0 1 0 19.2 12H12.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17.1" cy="6.9" r="2.1" fill="#8FCCFF"/></symbol>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".18"/></filter>
    <style>
      .l{animation:l 4.5s ease-in-out infinite}
      .l2{animation-delay:.3s}.l4{animation-delay:.9s}.l6{animation-delay:1.5s}
      @keyframes l{0%,100%{opacity:1}50%{opacity:.4}}
      .q{transform-box:fill-box;transform-origin:center;animation:q 3.6s ease-in-out infinite}
      .q2{animation-delay:.6s}.q3{animation-delay:1.2s}
      @keyframes q{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      .blink{animation:blink 1s steps(2) infinite}
      @keyframes blink{50%{opacity:0}}
      .arrow{animation:arrow 1.6s ease-in-out infinite}
      @keyframes arrow{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
      .check{stroke-dasharray:30;animation:check 4s ease-in-out infinite}
      @keyframes check{0%,70%{stroke-dashoffset:0}76%{stroke-dashoffset:30}100%{stroke-dashoffset:0}}
    </style>
  </defs>
  <rect width="1200" height="470" rx="28" fill="#F5F6F8"/>

  <!-- WITHOUT -->
  <text x="60" y="64" font-size="15" font-weight="600" fill="#c4281c" letter-spacing="1.5">WITHOUT</text>
  <text x="60" y="94" font-size="26" font-weight="600" fill="#1d1d1f">You hit a wall mid-task</text>
  <g filter="url(#sh)">
    <rect x="60" y="120" width="480" height="300" rx="16" fill="#1c1c1e"/>
    <circle cx="84" cy="142" r="6" fill="#ff5f57"/><circle cx="104" cy="142" r="6" fill="#febc2e"/><circle cx="124" cy="142" r="6" fill="#28c840"/>
    <g font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="15">
      <text x="84" y="190" fill="#8e8e93">$ opencode run "fix the bug"</text>
      <text x="84" y="220" fill="#ff6961" class="l l2">✕ Error: Free usage limit reached</text>
      <text x="84" y="250" fill="#8e8e93">$ switch to gemini…</text>
      <text x="84" y="280" fill="#ff6961" class="l l4">✕ 429 Too many requests</text>
      <text x="84" y="310" fill="#8e8e93">$ try groq…</text>
      <text x="84" y="340" fill="#ff6961" class="l l6">✕ Request too large (37k &gt; 8k)</text>
      <rect x="84" y="364" width="10" height="18" fill="#8e8e93" class="blink"/>
    </g>
  </g>
  <g font-size="15" font-weight="500">
    <g class="q q1"><rect x="380" y="150" width="190" height="40" rx="20" fill="#fff" stroke="#e5e5ea"/><text x="475" y="175" text-anchor="middle" fill="#1d1d1f">Which key has credit?</text></g>
    <g class="q q2"><rect x="400" y="250" width="184" height="40" rx="20" fill="#fff" stroke="#e5e5ea"/><text x="492" y="275" text-anchor="middle" fill="#1d1d1f">When does it reset?</text></g>
    <g class="q q3"><rect x="360" y="350" width="214" height="40" rx="20" fill="#fff" stroke="#e5e5ea"/><text x="467" y="375" text-anchor="middle" fill="#1d1d1f">How much did I burn?</text></g>
  </g>

  <!-- arrow -->
  <g class="arrow"><circle cx="608" cy="270" r="24" fill="#1F6BFF"/><path d="M598 270h18m-7-8 8 8-8 8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>

  <!-- WITH -->
  <text x="660" y="64" font-size="15" font-weight="600" fill="#1F6BFF" letter-spacing="1.5">WITH G.ai TOKEN TRAY</text>
  <text x="660" y="94" font-size="26" font-weight="600" fill="#1d1d1f">One glance, keep going</text>
  <g filter="url(#sh)">
    <rect x="660" y="120" width="480" height="300" rx="20" fill="#fff"/>
    <rect x="684" y="142" width="20" height="20" rx="6" fill="url(#sq)"/>
    <use href="#G" x="686.4" y="144.4" width="15.2" height="15.2"/>
    <text x="714" y="157" font-size="15" font-weight="500" fill="#1d1d1f">G.ai Token Tray</text>
    <rect x="684" y="176" width="432" height="128" rx="16" fill="#E9F6EC"/>
    <text x="704" y="202" font-size="12" font-weight="600" fill="#8e8e93" letter-spacing="1">BEST RIGHT NOW</text>
    <text x="704" y="234" font-size="20" font-weight="500" fill="#1d1d1f">Work OpenRouter</text>
    <text x="704" y="284" font-size="34" font-weight="300" fill="#1d1d1f">$18.40</text>
    <text x="822" y="283" font-size="14" fill="#6e6e73">lasts ~6 days</text>
    <circle cx="1074" cy="240" r="24" fill="#28a745"/>
    <path class="check" d="M1063 240l8 8 15-16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="684" y="340" font-size="14" fill="#6e6e73">Gemini is back in</text>
    <text x="1116" y="340" font-size="16" font-weight="500" fill="#1d1d1f" text-anchor="end">7h 11m</text>
    <text x="684" y="376" font-size="14" fill="#6e6e73">Spent today, all keys</text>
    <text x="1116" y="376" font-size="16" font-weight="500" fill="#1d1d1f" text-anchor="end">$1.10</text>
    <text x="684" y="404" font-size="13" fill="#a1a1a6">Copy the best key with Touch ID and paste it into your tool.</text>
  </g>
</svg>
